<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selling Piece Activation</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <!-- Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --bg-color: #f9fafb;
            --surface: #ffffff;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.5;
            padding: 12px;
            min-height: 100vh;
        }

        @media (min-width: 600px) {
            body {
                padding: 24px;
            }
        }

        .layout-container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .header-title {
            display: flex;
            flex-direction: column;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .subtitle {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .icon-btn {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 1.25rem;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn span {
            font-size: 0.875rem;
            font-weight: 500;
        }

        .icon-btn:hover {
            background-color: #f3f4f6;
            color: var(--text-primary);
        }

        .desktop-only {
            display: none;
        }

        @media (min-width: 600px) {
            .desktop-only {
                display: inline;
            }
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        .panel {
            background-color: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
        }

        @media (min-width: 600px) {
            .panel {
                padding: 24px;
            }
        }

        .panel-header {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .panel-header.collapsible {
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
        }
        
        .panel-header.collapsible:hover {
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.875rem;
            color: var(--text-primary);
            background-color: var(--surface);
            transition: border-color 0.2s, opacity 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .input-with-action {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .input-with-action input {
            flex: 1;
            min-width: 150px;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #f3f4f6;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: #e5e7eb;
        }

        .btn-warning {
            background-color: var(--warning);
            color: white;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Scanner */
        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            display: none;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
            background: #000;
        }

        #cameraSelectContainer {
            display: none;
            margin-bottom: 16px;
        }

        /* Iframe */
        .iframe-container {
            width: 100%;
            height: 75vh;
            min-height: 700px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            background-color: var(--bg-color);
            display: none; /* Collapsed by default */
            margin-top: 16px;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        /* Status Feedback */
        .status-text {
            font-size: 0.75rem;
            margin-top: 6px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }
        .text-warning { color: var(--warning); }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }

        .modal {
            background-color: var(--surface);
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            padding: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 1.125rem;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.25rem;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .close-btn:hover {
            color: var(--text-primary);
        }

        .loader {
            display: inline-block;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #fff;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
        }
        
        .loader-dark {
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-top: 2px solid var(--text-primary);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

    <div class="layout-container">
        <header>
            <div class="header-title">
                <h1>Selling Piece Activation</h1>
                <span class="subtitle">Link your physical asset to its digital destination</span>
            </div>
            <button class="icon-btn" onclick="openModal()" title="Settings">
                <i class="ri-settings-4-line"></i>
                <span class="desktop-only">Settings</span>
            </button>
        </header>

        <div class="grid-layout">
            <!-- Assignment Column -->
            <div class="panel">
                <div class="panel-header">
                    <i class="ri-qr-scan-2-line"></i> Activation Details
                </div>

                <div id="cameraSelectContainer" class="form-group">
                    <label for="cameraSelect">Select Camera</label>
                    <select id="cameraSelect" onchange="changeCamera()">
                        <option value="">Loading cameras...</option>
                    </select>
                </div>
                <div id="reader"></div>

                <div class="form-group">
                    <label for="uuidInput">Asset ID (UUID)</label>
                    <div class="input-with-action">
                        <input type="text" id="uuidInput" placeholder="e.g. 123e4567-e89b-12d3-a456-426614174000">
                        <button class="btn btn-secondary" onclick="readNFC()" id="nfcBtn" type="button" title="Read NFC Tag">
                            <i class="ri-rfid-line"></i> NFC
                        </button>
                        <button class="btn btn-secondary" onclick="toggleScanner()" id="scanBtn" type="button" title="Scan QR Code">
                            <i class="ri-camera-line"></i> Scan
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="valueInput">Destination Link (Maps Review)</label>
                    <div class="input-with-action">
                        <input type="text" id="valueInput" placeholder="Paste a Google Maps link here...">
                        <button class="btn btn-secondary" onclick="pasteValue()" type="button" title="Paste from Clipboard">
                            <i class="ri-clipboard-line"></i> Paste
                        </button>
                    </div>
                    <!-- Feedback text for resolving status -->
                    <div id="resolveStatus" class="status-text"></div>
                </div>

                <button class="btn btn-primary" id="assignBtn" onclick="assignToKV()" type="button">
                    <i class="ri-check-line"></i> Activate Asset
                </button>
            </div>

            <!-- Maps Extractor Column (Fallback / Collapsed) -->
            <div class="panel">
                <div class="panel-header collapsible" onclick="toggleIframe()">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <i class="ri-map-pin-line"></i> Maps Review Extractor (Fallback)
                    </div>
                    <i id="iframeToggleIcon" class="ri-arrow-down-s-line"></i>
                </div>
                <div class="iframe-container" id="extractorIframe">
                    <iframe src="https://productmate.com/google-review-link-generator" title="Maps Review Extractor" allow="clipboard-read; clipboard-write"></iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <h2>Admin Worker Config</h2>
                <button class="close-btn" onclick="closeModal()"><i class="ri-close-line"></i></button>
            </div>
            
            <form id="adminConfigForm" onsubmit="saveWorkerConfig(event)">
                <input type="text" name="username" value="admin" style="display:none;" autocomplete="username">
                
                <div class="form-group">
                    <label for="workerUrl">Admin Worker URL</label>
                    <input type="url" id="workerUrl" name="url" autocomplete="url" placeholder="https://admin-worker.yourdomain.workers.dev" required>
                </div>
                <div class="form-group">
                    <label for="adminPassword">Admin Password</label>
                    <input type="password" id="adminPassword" name="password" autocomplete="current-password" placeholder="Worker secret password" required>
                </div>
                <button type="submit" class="btn btn-primary" id="saveConfigBtn">
                    Save Configuration
                </button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const workerUrl = localStorage.getItem('workerUrl');
            const adminPassword = localStorage.getItem('adminPassword');

            if (workerUrl) document.getElementById('workerUrl').value = workerUrl;
            if (adminPassword) document.getElementById('adminPassword').value = adminPassword;
            
            // Attach URL parsing listener
            setupAutoUrlParser();
        });
        
        // Iframe Toggle
        function toggleIframe() {
            const iframeCont = document.getElementById('extractorIframe');
            const icon = document.getElementById('iframeToggleIcon');
            if (iframeCont.style.display === 'none' || iframeCont.style.display === '') {
                iframeCont.style.display = 'block';
                icon.className = 'ri-arrow-up-s-line';
            } else {
                iframeCont.style.display = 'none';
                icon.className = 'ri-arrow-down-s-line';
            }
        }

        // Modal Functions
        const modal = document.getElementById('settingsModal');
        function openModal() {
            modal.style.display = 'flex';
        }
        function closeModal() {
            modal.style.display = 'none';
        }
        
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        function saveWorkerConfig(event) {
            event.preventDefault();
            
            let url = document.getElementById('workerUrl').value.trim();
            if (url.endsWith('/')) url = url.slice(0, -1);

            localStorage.setItem('workerUrl', url);
            localStorage.setItem('adminPassword', document.getElementById('adminPassword').value);

            const btn = document.getElementById('saveConfigBtn');
            const origText = btn.innerHTML;
            btn.innerHTML = 'Saved!';
            btn.style.backgroundColor = 'var(--success)';
            
            setTimeout(() => {
                btn.innerHTML = origText;
                btn.style.backgroundColor = '';
                closeModal();
            }, 1000);
        }

        // ---------- Auto Maps Link Parser Logic ----------
        
        function getLittleEndianBytes(e) {
            const t = [];
            let n = BigInt(e);
            for (let r = 0; r < 8; r++) {
                t.push(Number(n & 0xffn));
                n >>= 8n;
            }
            return t;
        }

        function computePlaceId(hex1Str, hex2Str) {
            const hex1 = BigInt(hex1Str);
            const hex2 = BigInt(hex2Str);
            
            const innerArray = [9, ...getLittleEndianBytes(hex1), 17, ...getLittleEndianBytes(hex2)];
            const fullArray = [10, innerArray.length, ...innerArray];
            
            const uint8 = new Uint8Array(fullArray);
            let b64 = btoa(String.fromCharCode(...uint8));
            
            return b64.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
        }

        async function processGoogleMapsLink(url) {
            const regex = /!1s(0x[a-f0-9]+):(0x[a-f0-9]+)/i;
            
            try {
                // If it's already a long URL with the hex values, convert directly
                const directMatch = url.match(regex);
                if (directMatch) {
                    const placeId = computePlaceId(directMatch[1], directMatch[2]);
                    return { success: true, link: `https://search.google.com/local/writereview?placeid=${placeId}` };
                }

                // If it's a short URL, resolve it via API first
                if (url.match(/^https?:\/\/(maps\.app\.goo\.gl|goo\.gl\/maps)\//i)) {
                    const response = await fetch("https://productmate.com/api/resolve-url", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ url: url })
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        if (data.resolved_url) {
                            const match = data.resolved_url.match(regex);
                            if (match) {
                                const placeId = computePlaceId(match[1], match[2]);
                                return { success: true, link: `https://search.google.com/local/writereview?placeid=${placeId}` };
                            } else {
                                return { success: false, error: "No target hex values found in resolved URL" };
                            }
                        } else {
                            return { success: false, error: "API did not return a resolved URL" };
                        }
                    } else {
                        return { success: false, error: "API request rejected or blocked" };
                    }
                }
                
                return { success: false, error: "URL does not match expected short link format" };
            } catch (error) {
                console.error("Error processing maps link:", error);
                return { success: false, error: error.message || "Network error" };
            }
        }

        function setupAutoUrlParser() {
            const valueInput = document.getElementById('valueInput');
            const statusEl = document.getElementById('resolveStatus');
            
            valueInput.addEventListener('input', async (e) => {
                const text = e.target.value.trim();
                statusEl.innerHTML = '';
                
                // Trigger if it looks like a google maps link (short or long)
                if (text.match(/https?:\/\/(maps\.app\.goo\.gl|goo\.gl\/maps|www\.google\.com\/maps)/i)) {
                    // Prevent re-processing if it's already a placeid review link
                    if (text.includes('placeid=')) return;

                    // Lock input while resolving
                    const originalValue = text;
                    e.target.readOnly = true;
                    e.target.style.opacity = '0.7';
                    
                    statusEl.innerHTML = '<span class="text-warning"><div class="loader loader-dark" style="width:12px;height:12px;border-width:2px;"></div> Resolving Maps link...</span>';
                    
                    const result = await processGoogleMapsLink(originalValue);
                    
                    if (result.success) {
                        e.target.value = result.link;
                        statusEl.innerHTML = '<span class="text-success"><i class="ri-check-line"></i> Converted to Place ID link</span>';
                    } else {
                        // Revert to original if it failed to resolve properly
                        e.target.value = originalValue;
                        statusEl.innerHTML = `<span class="text-danger"><i class="ri-error-warning-line"></i> Resolution failed: ${result.error}. Sending as normal link.</span>`;
                    }
                    
                    // Unlock input
                    e.target.readOnly = false;
                    e.target.style.opacity = '1';
                }
            });
        }

        async function pasteValue() {
            try {
                const text = await navigator.clipboard.readText();
                const valueInput = document.getElementById('valueInput');
                valueInput.value = text;
                
                // Manually trigger the input event to process the pasted link
                valueInput.dispatchEvent(new Event('input'));
            } catch (err) {
                console.error('Failed to read clipboard contents: ', err);
                alert('Could not paste. Please ensure clipboard permissions are granted.');
            }
        }

        // ---------- NFC Scanner Logic ----------

        async function readNFC() {
            const nfcBtn = document.getElementById('nfcBtn');
            const originalText = '<i class="ri-rfid-line"></i> NFC';

            if ('NDEFReader' in window) {
                try {
                    nfcBtn.innerHTML = '<div class="loader loader-dark"></div> Wait...';
                    nfcBtn.disabled = true;

                    const ndef = new NDEFReader();
                    await ndef.scan();
                    
                    nfcBtn.innerHTML = '<i class="ri-rss-line"></i> Tap Tag';
                    nfcBtn.classList.remove('btn-secondary');
                    nfcBtn.classList.add('btn-warning');
                    nfcBtn.disabled = false;

                    ndef.addEventListener("readingerror", () => {
                        alert("Cannot read data from the NFC tag. Try another one?");
                        resetNfcBtn(nfcBtn, originalText);
                    });

                    ndef.addEventListener("reading", ({ message, serialNumber }) => {
                        let text = "";
                        for (const record of message.records) {
                            if (record.recordType === "text" || record.recordType === "url") {
                                const textDecoder = new TextDecoder(record.encoding || "utf-8");
                                text += textDecoder.decode(record.data);
                            }
                        }
                        
                        const uuid = extractUUID(text) || text;
                        document.getElementById('uuidInput').value = uuid;
                        resetNfcBtn(nfcBtn, originalText);
                    });
                } catch (error) {
                    console.error(error);
                    alert("Error starting NFC: " + error.message);
                    resetNfcBtn(nfcBtn, originalText);
                }
            } else {
                alert("Web NFC is not supported on this browser/device. Please use Chrome on Android and ensure you are on HTTPS.");
                resetNfcBtn(nfcBtn, originalText);
            }
        }

        function resetNfcBtn(btn, text) {
            btn.innerHTML = text;
            btn.classList.add('btn-secondary');
            btn.classList.remove('btn-warning');
            btn.disabled = false;
        }

        // ---------- QR Scanner Logic ----------

        let html5QrcodeScanner = null;
        let currentCameraId = null;

        function extractUUID(text) {
            const uuidRegex = /[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/;
            const match = text.match(uuidRegex);
            return match ? match[0] : null;
        }

        function onScanSuccess(decodedText, decodedResult) {
            const uuid = extractUUID(decodedText) || decodedText;
            document.getElementById('uuidInput').value = uuid;
            stopScanner();
        }

        function onScanFailure(error) {
            // Ignored for continuous scanning
        }

        function toggleScanner() {
            if (html5QrcodeScanner) {
                stopScanner();
            } else {
                initScanner();
            }
        }

        function initScanner() {
            const cameraSelectContainer = document.getElementById('cameraSelectContainer');
            const cameraSelect = document.getElementById('cameraSelect');

            Html5Qrcode.getCameras().then(devices => {
                if (devices && devices.length) {
                    cameraSelectContainer.style.display = 'block';
                    cameraSelect.innerHTML = '';
                    
                    devices.forEach(device => {
                        const option = document.createElement('option');
                        option.value = device.id;
                        option.text = device.label || `Camera ${cameraSelect.length + 1}`;
                        cameraSelect.appendChild(option);
                    });

                    if (!currentCameraId) {
                        currentCameraId = devices[0].id;
                    }
                    cameraSelect.value = currentCameraId;
                    
                    startScannerWithCamera(currentCameraId);
                } else {
                    alert("No cameras found on your device.");
                }
            }).catch(err => {
                alert("Error accessing cameras (check permissions): " + err);
            });
        }

        function changeCamera() {
            const cameraSelect = document.getElementById('cameraSelect');
            currentCameraId = cameraSelect.value;
            
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    html5QrcodeScanner.clear();
                    startScannerWithCamera(currentCameraId);
                });
            }
        }

        function startScannerWithCamera(cameraId) {
            const readerElement = document.getElementById('reader');
            const scanBtn = document.getElementById('scanBtn');

            readerElement.style.display = 'block';
            scanBtn.innerHTML = '<i class="ri-close-line"></i> Stop';

            html5QrcodeScanner = new Html5Qrcode("reader");
            html5QrcodeScanner.start(
                cameraId,
                { fps: 10, qrbox: { width: 250, height: 250 } },
                onScanSuccess,
                onScanFailure
            ).catch(err => {
                alert("Error starting camera: " + err);
                stopScanner();
            });
        }

        function stopScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    html5QrcodeScanner.clear();
                    html5QrcodeScanner = null;
                    document.getElementById('reader').style.display = 'none';
                    document.getElementById('cameraSelectContainer').style.display = 'none';
                    document.getElementById('scanBtn').innerHTML = '<i class="ri-camera-line"></i> Scan';
                });
            }
        }

        // ---------- KV Assignment Logic ----------

        async function assignToKV() {
            const workerUrl = localStorage.getItem('workerUrl');
            const adminPassword = localStorage.getItem('adminPassword');

            const uuid = document.getElementById('uuidInput').value.trim();
            const value = document.getElementById('valueInput').value.trim();

            if (!workerUrl || !adminPassword) {
                alert('Please configure Admin Worker settings first.');
                openModal();
                return;
            }

            if (!uuid) {
                alert('Please enter or scan a Target UUID.');
                return;
            }

            const btn = document.getElementById('assignBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<div class="loader"></div> <span style="margin-left:8px;">Saving...</span>';
            btn.disabled = true;

            try {
                const targetUrl = `${workerUrl}/assign`;

                const response = await fetch(targetUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${adminPassword}`
                    },
                    body: JSON.stringify({ uuid, value })
                });

                const resultText = await response.text();
                let resultJson = null;
                try { resultJson = JSON.parse(resultText); } catch (e) { }

                if (response.ok && (!resultJson || resultJson.success !== false)) {
                    btn.innerHTML = '<i class="ri-check-line"></i> Success!';
                    btn.style.backgroundColor = 'var(--success)';
                    document.getElementById('uuidInput').value = '';
                    document.getElementById('valueInput').value = '';
                    document.getElementById('resolveStatus').innerHTML = ''; // Clear status text
                    
                    setTimeout(() => {
                        btn.innerHTML = originalText;
                        btn.style.backgroundColor = '';
                    }, 3000);
                } else {
                    console.error("Cloudflare error", resultJson || resultText);
                    alert('Failed to assign to Cloudflare KV: ' + (resultJson?.errors?.[0]?.message || 'Unknown error'));
                    btn.innerHTML = originalText;
                }
            } catch (error) {
                console.error("Error writing to Cloudflare KV", error);
                alert("Failed to write to Cloudflare KV. Check console for details.");
                btn.innerHTML = originalText;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
